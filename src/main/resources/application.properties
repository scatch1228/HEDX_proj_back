spring.application.name=HEDX_PROJECT-1

# H2 Database Local Configuration
#spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.url=jdbc:h2:file:./data/testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

## JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enable the H2 Web Console (Allows you to view tables in your browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#OpenAI
# Spring AI Google AI Configuration
spring.ai.google.genai.api-key={PRIVATEKEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash
